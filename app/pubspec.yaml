name: prompt_heist
description: Prompt Heist arcade game
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  web: ^1.1.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: AppMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: AppEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf